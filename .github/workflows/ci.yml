# npm run check (format, lint, types and every test, web and Rust) on macOS,
# Windows and Linux, then a smoke run of the built app on each (P.11).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev xvfb

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Tool versions
        run: |
          git --version
          node --version
          cargo --version

      - run: npm ci

      # The two halves of `npm run check`, as separate steps: the Rust one
      # also runs when the web one fails, so every run shows both. Either
      # failing still fails the job.
      - name: npm run check:web
        run: npm run check:web

      - name: npm run check:rust
        if: success() || failure()
        run: npm run check:rust

      # src-tauri/build.rs swaps Tauri's manifest for one embedded by the
      # linker; the app's own executable must still carry it.
      - name: The Windows app carries its manifest
        if: runner.os == 'Windows' && (success() || failure())
        shell: pwsh
        run: |
          cargo build -p gitcraft --bin gitcraft
          $exe = [IO.File]::ReadAllBytes("target/debug/gitcraft.exe")
          $text = [Text.Encoding]::ASCII.GetString($exe)
          if (-not $text.Contains("Microsoft.Windows.Common-Controls")) {
            Write-Error "gitcraft.exe has no Common Controls v6 manifest"
            exit 1
          }
          Write-Output "gitcraft.exe carries the Common Controls v6 manifest"

      # The built app (interface included) opens its window, loads the
      # interface in the system's web engine (WKWebView, WebView2,
      # WebKitGTK), checks what it needs from it and exits: 0 if all is
      # there. See src-tauri/src/smoke.rs. Linux has no display: Xvfb.
      - name: Smoke run of the app
        if: success() || failure()
        shell: bash
        run: |
          npx tauri build --debug --no-bundle
          app=target/debug/gitcraft
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$app" --smoke
          else
            "$app" --smoke
          fi
