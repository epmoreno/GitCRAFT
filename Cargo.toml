[workspace]
resolver = "3"
members = ["crates/gitcraft-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
gitcraft-core = { path = "crates/gitcraft-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# specta is pre-release: pin exactly, as tauri-specta requires.
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "time", "sync"] }
tokio-util = "0.7"
libc = "0.2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
