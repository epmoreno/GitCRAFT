[package]
name = "gitcraft-core"
description = "Git operations, output parsers and graph layout for GitCRAFT (no Tauri dependency)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Deterministic temporary repositories for integration tests (`testing::TestRepo`).
testing = ["dep:tempfile"]
# Derives specta::Type on public types so the app can export TypeScript bindings.
specta = ["dep:specta"]

[dependencies]
serde.workspace = true
specta = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

# Moving discarded untracked files to the Trash (and back, for undo).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }

[dev-dependencies]
gitcraft-core = { path = ".", features = ["testing"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
