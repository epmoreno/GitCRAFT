[package]
name = "gitcraft-core"
description = "Git operations, output parsers and graph layout for GitCRAFT (no Tauri dependency)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Deterministic temporary repositories for integration tests (`testing::TestRepo`).
testing = ["dep:tempfile"]
# Derives specta::Type on public types so the app can export TypeScript bindings.
specta = ["dep:specta"]

# A simulated `gh` for the tests (testing::fake_gh); never built for the app.
[[bin]]
name = "fake-gh"
path = "src/bin/fake_gh.rs"
required-features = ["testing"]
test = false
doctest = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "user"] }

# The Recycle Bin (IFileOperation) for discarded untracked files. The same
# version Tauri already uses on Windows; windows-core because #[implement]
# names it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-core = "0.62.2"

# Moving discarded untracked files to the Trash (and back, for undo).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }

[dev-dependencies]
gitcraft-core = { path = ".", features = ["testing"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
