[package]
name = "gitcraft-core"
description = "Git operations, output parsers and graph layout for GitCRAFT (no Tauri dependency)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Deterministic temporary repositories for integration tests (`testing::TestRepo`).
testing = ["dep:tempfile"]

[dependencies]
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[dev-dependencies]
gitcraft-core = { path = ".", features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
