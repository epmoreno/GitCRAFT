[package]
name = "gitcraft"
description = "GitCRAFT – cliente Git visual, rápido y de código abierto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "gitcraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gitcraft-core = { workspace = true, features = ["specta"] }
notify = "8"
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
# Pre-release: pinned exactly together with specta (see its docs).
specta-typescript = "=0.0.13"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tokio.workspace = true

[dev-dependencies]
gitcraft-core = { workspace = true, features = ["specta", "testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
