<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- GitCRAFT app icon: two lanes forged into one, copper on graphite. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b31"/>
      <stop offset="1" stop-color="#14171a"/>
    </linearGradient>
    <linearGradient id="cu" gradientUnits="userSpaceOnUse" x1="300" y1="200" x2="700" y2="840">
      <stop offset="0" stop-color="#f4a76a"/>
      <stop offset="1" stop-color="#c96f35"/>
    </linearGradient>
  </defs>
  <rect x="80" y="80" width="864" height="864" rx="196" fill="url(#bg)"/>
  <g fill="none" stroke-linecap="round" stroke-width="56">
    <path d="M384 260 V764" stroke="url(#cu)"/>
    <path d="M640 260 V420 C640 520 384 520 384 620" stroke="#8fa3b5"/>
  </g>
  <circle cx="384" cy="260" r="64" fill="#14171a" stroke="url(#cu)" stroke-width="44"/>
  <circle cx="640" cy="260" r="64" fill="#14171a" stroke="#8fa3b5" stroke-width="44"/>
  <circle cx="384" cy="764" r="78" fill="url(#cu)"/>
</svg>
